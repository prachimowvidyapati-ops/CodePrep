<!DOCTYPE html>
<html>
<head>
<title>Interview Bot</title>
<style>

  body {
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  /* ---------- Chat window ---------- */
  #chatApp {
    background: white;
    width: 100%;
    max-width: 800px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 500px;
  }

  #chatHeader {
    background: #4b2e83;
    color: white;
    padding: 16px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
  }

  #chatMessages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f5f6fa;
  }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    margin: 6px 0;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14.5px;
    clear: both;
  }

  .bot {
    background: #e4e6eb;
    color: #222;
    float: left;
    border-bottom-left-radius: 3px;
  }

  .user {
    background: #764ba2;
    color: white;
    float: right;
    border-bottom-right-radius: 3px;
  }

  /* ---------- Input area ---------- */
  #inputRow {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
    background: white;
  }

  #userInput {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 20px;
    font-size: 14.5px;
    outline: none;
  }

  #sendBtn {
    margin-left: 8px;
    background: #764ba2;
    color: white;
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  #sendBtn:hover {
    background: #5e3a85;
  }

</style>
</head>
<body>

<div id="chatApp">
  <div id="chatHeader">💬 Interview Bot</div>
  <div id="chatMessages"></div>
  <div id="inputRow">
    <input type="text" id="userInput" placeholder="Type your answer..." onkeypress="handleEnter(event)">
    <button id="sendBtn" onclick="handleSend()">➤</button>
  </div>
</div>

<script>
// ---------- STEP 1: Questions for each language ----------
// Each question has: the question text, a list of acceptable keywords, and an explanation
var questions = {

  html: [
    { question: "What does HTML stand for?",
      keywords: ["hypertext markup language", "hyper text markup language"],
      explain: "HTML means HyperText Markup Language." },
    { question: "Which tag is used to create a hyperlink?",
      keywords: ["<a>", "a tag", "anchor"],
      explain: "The <a> tag (anchor tag) is used to create a hyperlink." },
    { question: "Which tag is used to insert an image?",
      keywords: ["<img>", "img"],
      explain: "The <img> tag is used to display an image." },
    { question: "Which attribute gives alternate text for an image?",
      keywords: ["alt"],
      explain: "The 'alt' attribute provides alternate text for an image." },
    { question: "Which tag defines the largest heading?",
      keywords: ["<h1>", "h1"],
      explain: "<h1> is the largest heading tag; <h6> is the smallest." }
  ],

  css: [
    { question: "What does CSS stand for?",
      keywords: ["cascading style sheets"],
      explain: "CSS means Cascading Style Sheets." },
    { question: "Which property is used to change text color?",
      keywords: ["color"],
      explain: "The 'color' property sets the text color." },
    { question: "Which symbol is used to select a class in CSS?",
      keywords: [".", "dot", "period"],
      explain: "A dot (.) is used to select a class, for example .box" },
    { question: "Which property adds space inside an element's border?",
      keywords: ["padding"],
      explain: "'padding' adds space inside the border; 'margin' adds space outside it." },
    { question: "Which property makes text bold?",
      keywords: ["font-weight", "fontweight"],
      explain: "'font-weight: bold' makes text thicker." }
  ],

  javascript: [
    { question: "Which keyword declares a variable that can be reassigned?",
      keywords: ["let"],
      explain: "'let' declares a variable that can be changed later." },
    { question: "Which operator checks strict equality (value and type)?",
      keywords: ["===", "triple equals"],
      explain: "'===' checks both the value and the type." },
    { question: "Which symbol starts a single-line comment?",
      keywords: ["//"],
      explain: "'//' is used for single-line comments in JavaScript." },
    { question: "Which array method adds an item to the end of the array?",
      keywords: ["push"],
      explain: "push() adds a new item to the end of an array." },
    { question: "Which function selects an element by its id?",
      keywords: ["getelementbyid"],
      explain: "document.getElementById() returns the element with that id." }
  ],

  python: [
    { question: "Which symbol is used for comments in Python?",
      keywords: ["#"],
      explain: "'#' starts a comment in Python." },
    { question: "Which keyword is used to define a function in Python?",
      keywords: ["def"],
      explain: "Functions are defined using the 'def' keyword." },
    { question: "Which brackets are used to create a list in Python?",
      keywords: ["[]", "square brackets", "[", "]"],
      explain: "Square brackets [] are used to create a list." },
    { question: "Which function returns the number of items in a list?",
      keywords: ["len"],
      explain: "len() returns how many items are in a list or string." },
    { question: "Which keyword is used to loop over items in a list?",
      keywords: ["for"],
      explain: "'for' is used to loop over items in a sequence." }
  ],

  c: [
    { question: "Which function is the entry point of every C program?",
      keywords: ["main"],
      explain: "Every C program begins execution from main()." },
    { question: "Which header file is needed to use printf()?",
      keywords: ["stdio.h", "stdio"],
      explain: "printf() and scanf() are declared in stdio.h" },
    { question: "Which symbol is used to end a statement in C?",
      keywords: [";", "semicolon"],
      explain: "Every statement in C ends with a semicolon (;)." },
    { question: "Which data type is used to store a single character?",
      keywords: ["char"],
      explain: "'char' is used to store a single character in C." },
    { question: "Which operator is used to get the address of a variable?",
      keywords: ["&"],
      explain: "The '&' operator returns the memory address of a variable." }
  ]

};

// ---------- STEP 2: Variables to track the conversation ----------
var stage = "chooseLang";  // chooseLang -> quiz -> finished
var currentLang = "";
var currentIndex = 0;
var score = 0;

// ---------- STEP 3: Add a chat bubble to the screen ----------
function addMessage(sender, text) {
  var messages = document.getElementById("chatMessages");
  var bubble = document.createElement("div");
  bubble.className = "bubble " + sender;
  bubble.innerHTML = text;
  messages.appendChild(bubble);
  messages.scrollTop = messages.scrollHeight; // auto-scroll to latest message
}

// ---------- STEP 4: Greet the user when page loads ----------
function greet() {
  addMessage("bot", "Hi! I'm your interview bot 🤖");
  addMessage("bot", "Which language do you want to be interviewed in? (html / css / javascript / python / c)");
}

// ---------- STEP 5: Handle Enter key and Send button ----------
function handleEnter(event) {
  if (event.key === "Enter") {
    handleSend();
  }
}

function handleSend() {
  var input = document.getElementById("userInput");
  var text = input.value.trim();
  if (text === "") return;

  addMessage("user", text);
  input.value = "";

  if (stage === "chooseLang") {
    chooseLanguage(text);
  } else if (stage === "quiz") {
    checkAnswer(text);
  } else if (stage === "finished") {
    if (text.toLowerCase() === "restart") {
      stage = "chooseLang";
      addMessage("bot", "Great! Which language this time? (html / css / javascript / python / c)");
    } else {
      addMessage("bot", "Type 'restart' to try another language.");
    }
  }
}

// ---------- STEP 6: Handle the language chosen by user ----------
function chooseLanguage(text) {
  var lang = text.toLowerCase();

  if (questions[lang]) {
    currentLang = lang;
    currentIndex = 0;
    score = 0;
    stage = "quiz";
    addMessage("bot", "Great! Let's start your " + lang + " interview.");
    askQuestion();
  } else {
    addMessage("bot", "Please type one of: html, css, javascript, python, c");
  }
}

// ---------- STEP 7: Bot asks the current question ----------
function askQuestion() {
  var q = questions[currentLang][currentIndex];
  var total = questions[currentLang].length;
  addMessage("bot", "Question " + (currentIndex + 1) + " of " + total + ": " + q.question);
}

// ---------- STEP 8: Check the user's typed answer ----------
function checkAnswer(text) {
  var q = questions[currentLang][currentIndex];
  var userAnswer = text.toLowerCase();

  var isCorrect = false;
  for (var i = 0; i < q.keywords.length; i++) {
    if (userAnswer.indexOf(q.keywords[i]) !== -1) {
      isCorrect = true;
    }
  }

  if (isCorrect) {
    score = score + 1;
    addMessage("bot", "✅ Correct! " + q.explain);
  } else {
    addMessage("bot", "❌ Not quite. " + q.explain);
  }

  currentIndex = currentIndex + 1;

  if (currentIndex < questions[currentLang].length) {
    askQuestion();
  } else {
    stage = "finished";
    addMessage("bot", "🎉 Interview done! Your score: " + score + " / " + questions[currentLang].length);
    addMessage("bot", "Type 'restart' to try another language.");
  }
}

// ---------- START ----------
greet();
</script>

</body>
</html>
